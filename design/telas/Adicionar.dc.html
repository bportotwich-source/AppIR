<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Adicionar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
a{color:#0f766e}a:hover{color:#0b5c56}
a:focus-visible,button:focus-visible{outline:2px solid #0f766e;outline-offset:2px}
.op:hover{background:#eef1f0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0c2a27; color: #15201d; font-family: 'Instrument Sans', 'Segoe UI', system-ui, sans-serif; font-size: 15px; line-height: 22px">

<div aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(#0c2a27 0 300px, #f4f6f5 300px); opacity: 0.35"></div>
<a href="PfInicio.dc.html" aria-label="Fechar" style="position: absolute; inset: 0 0 520px 0"></a>

<section role="dialog" aria-modal="true" aria-labelledby="add-t" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 32px; border-radius: 28px 28px 0 0; background: #ffffff; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 -12px 40px rgba(0,0,0,0.25)">
<span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 999px; background: #d5dbd8"></span>
<div style="display: flex; justify-content: space-between; align-items: center">
<h2 id="add-t" style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 600">Adicionar</h2>
<a href="PfInicio.dc.html" aria-label="Fechar" style="width: 44px; height: 44px; border-radius: 999px; background: #eef1f0; color: #15201d; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></a>
</div>

<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px">
<sc-for list="{{opcoes}}" as="o" hint-placeholder-count="4">
<li><a class="op" href="{{o.href}}" style="display: flex; align-items: center; gap: 14px; padding: 12px; margin: 0 -12px; border-radius: 16px; text-decoration: none; color: #15201d">
<span aria-hidden="true" style="flex: none; width: 48px; height: 48px; border-radius: 14px; background: {{o.fundo}}; color: {{o.cor}}; display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{o.icone}}"/></svg>
</span>
<span style="flex: 1 1 auto; display: flex; flex-direction: column"><b style="font-weight: 600">{{o.titulo}}</b><span style="font-size: 13px; line-height: 18px; color: #5b6763">{{o.desc}}</span></span>
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5b6763" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
</a></li>
</sc-for>
</ul>

<p style="margin: 0; padding: 12px 14px; border-radius: 14px; background: #eef1f0; font-size: 13px; line-height: 19px; color: #3d4945">Recebeu a nota por e-mail? No e-mail, toque em Compartilhar e escolha Meu MEI. O PDF chega direto aqui.</p>
</section>

</div>
</x-dc>

</html>
