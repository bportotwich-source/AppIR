<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Comprovantes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
a{color:#0f766e}a:hover{color:#0b5c56}
a:focus-visible,button:focus-visible{outline:2px solid #0f766e;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 1180px; position: relative; overflow: hidden; background: #f4f6f5; color: #15201d; font-family: 'Instrument Sans', 'Segoe UI', system-ui, sans-serif; font-size: 15px; line-height: 22px">
<div style="padding: 24px 20px 120px; display: flex; flex-direction: column; gap: 22px">

<header style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 600; letter-spacing: -0.01em">Comprovantes</h1>
<p style="margin: 0; font-size: 14px; line-height: 20px; color: #5b6763">Notas e recibos lidos no celular. Cada um é ligado à compra certa do extrato.</p>
</header>

<div role="group" aria-label="Filtro" style="display: flex; gap: 8px; flex-wrap: wrap">
<sc-for list="{{filtros}}" as="f" hint-placeholder-count="3">
<button type="button" aria-pressed="{{f.on}}" onClick="{{f.pick}}" style="min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid {{f.borda}}; background: {{f.fundo}}; color: {{f.cor}}; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">{{f.nome}}</button>
</sc-for>
</div>

<sc-for list="{{grupos}}" as="g" hint-placeholder-count="2">
<section style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><h2 style="margin: 0; font-size: 18px; line-height: 24px; font-weight: 600">{{g.mes}}</h2><span class="mm-num" style="font-size: 13px; color: #5b6763">{{g.total}}</span></div>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border-radius: 18px; background: #ffffff; box-shadow: 0 0 0 1px #e3e7e5">
<sc-for list="{{g.itens}}" as="c" hint-placeholder-count="3">
<li style="border-top: {{c.borda}}"><a href="Comprovante.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; text-decoration: none; color: #15201d">
<span aria-hidden="true" style="flex: none; width: 40px; height: 40px; border-radius: 12px; background: {{c.fundo}}; color: {{c.cor}}; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">{{c.sigla}}</span>
<span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<b style="font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.loja}}</b>
<span style="font-size: 13px; line-height: 18px; color: #5b6763">{{c.info}}</span>
<span style="align-self: flex-start; padding: 1px 8px; border-radius: 999px; background: {{c.estFundo}}; color: {{c.estCor}}; font-size: 12px; line-height: 18px; font-weight: 600">{{c.estado}}</span>
</span>
<b class="mm-num" style="font-weight: 500; white-space: nowrap">{{c.valor}}</b>
</a></li>
</sc-for>
</ul>
</section>
</sc-for>

</div>

<nav aria-label="Navegação" style="position: absolute; left: 16px; right: 16px; bottom: 16px; height: 68px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-around; padding: 0 6px; border-radius: 26px; background: rgba(255,255,255,0.95); box-shadow: 0 12px 32px rgba(12,42,39,0.18), 0 0 0 1px rgba(12,42,39,0.06)">
<a href="PfInicio.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: 56px; min-height: 52px; text-decoration: none; font-size: 11px; line-height: 14px; color: #5b6763; font-weight: 600"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-5h4v5"/></svg>Início</a>
<a href="PfRevisar.dc.html" style="position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: 56px; min-height: 52px; text-decoration: none; font-size: 11px; line-height: 14px; color: #5b6763; font-weight: 600"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="12" rx="3"/><path d="M7 5h10"/><path d="m9 14 2 2 4-4"/></svg>Revisar<span style="position: absolute; top: 2px; right: 8px; min-width: 18px; height: 18px; box-sizing: border-box; padding: 0 5px; border-radius: 999px; background: #b45309; border: 2px solid #ffffff; color: #ffffff; font-size: 10px; line-height: 14px; font-weight: 700; text-align: center">11</span></a>
<a href="Adicionar.dc.html" aria-label="Adicionar" style="width: 60px; height: 60px; margin-top: -34px; border-radius: 999px; background: #0f766e; color: #ffffff; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 20px rgba(15,118,110,0.4), 0 0 0 6px #f4f6f5"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></a>
<a href="Comprovantes.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: 56px; min-height: 52px; text-decoration: none; font-size: 11px; line-height: 14px; color: #0f766e; font-weight: 700"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>Notas</a>
<a href="Declaracao.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: 56px; min-height: 52px; text-decoration: none; font-size: 11px; line-height: 14px; color: #5b6763; font-weight: 600"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg>Declaração</a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1180}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filtro: 'Todos' };
  }
  renderVals() {
    var self = this;
    var est = {
      ok: ['Ligado à compra de ', '#e7f6ec', '#166534'],
      falta: ['Sem compra no extrato', '#fffbeb', '#92400e'],
      ir: ['Abate no IR · ligado', '#fde7ef', '#9d174d']
    };
    var dados = [
      { mes: 'Outubro', total: '5 comprovantes · R$ 1.011,28', itens: [
        ['SM', 'Supermercado Bom Preço', 'NFC-e · 23 itens · 19/10', 'R$ 312,48', '#e6f4f1', '#0f766e', 'ok', '19/10'],
        ['DR', 'Drogaria São Paulo', 'NFC-e · 3 itens · 17/10', 'R$ 89,90', '#fde7ef', '#be185d', 'ok', '17/10'],
        ['AM', 'Amazon', 'PDF da nota · 1 item · 14/10', 'R$ 159,00', '#e0f2fe', '#0369a1', 'falta', ''],
        ['CO', 'Clínica Odonto Sorriso', 'Recibo · Bruno · 10/10', 'R$ 350,00', '#fde7ef', '#be185d', 'ir', ''],
        ['PA', 'Padaria Estrela', 'NFC-e · 4 itens · 03/10', 'R$ 99,90', '#fff4e0', '#b45309', 'ok', '03/10']
      ] },
      { mes: 'Setembro', total: '2 comprovantes · R$ 420,15', itens: [
        ['SM', 'Supermercado Bom Preço', 'NFC-e · 31 itens · 28/09', 'R$ 401,25', '#e6f4f1', '#0f766e', 'ok', '28/09'],
        ['DR', 'Drogaria São Paulo', 'NFC-e · 1 item · 12/09', 'R$ 18,90', '#fde7ef', '#be185d', 'ok', '12/09']
      ] }
    ];
    var f = this.state.filtro;
    return {
      filtros: ['Todos', 'Sem compra · 1', 'Saúde'].map(function (n) {
        var on = n === f;
        return { nome: n, on: on ? 'true' : 'false', fundo: on ? '#15201d' : '#ffffff', cor: on ? '#ffffff' : '#15201d', borda: on ? '#15201d' : '#d5dbd8', pick: function () { self.setState({ filtro: n }); } };
      }),
      grupos: dados.map(function (g) {
        var itens = g.itens.filter(function (c) {
          if (f === 'Todos') return true;
          if (f === 'Saúde') return c[6] === 'ir' || c[1].indexOf('Drogaria') === 0;
          return c[6] === 'falta';
        });
        return { mes: g.mes, total: g.total, itens: itens.map(function (c, i) {
          var e = est[c[6]];
          return { sigla: c[0], loja: c[1], info: c[2], valor: c[3], fundo: c[4], cor: c[5], estado: c[6] === 'ok' ? e[0] + c[7] : e[0], estFundo: e[1], estCor: e[2], borda: i ? '1px solid #eef1f0' : '0' };
        }) };
      }).filter(function (g) { return g.itens.length; })
    };
  }
}
</script>
</body>
</html>
