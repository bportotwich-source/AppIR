<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Ajustes</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/meumei/components/bundle.css">
<script src="ds/meumei/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
a{color:#0f766e}a:hover{color:#0b5c56}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #0f766e;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 980px; position: relative; overflow: hidden; background: #f4f6f5; color: #15201d; font-family: 'Instrument Sans', 'Segoe UI', system-ui, sans-serif; font-size: 15px; line-height: 22px">
<div style="padding: 16px 20px 40px; display: flex; flex-direction: column; gap: 28px">

<header style="display: flex; flex-direction: column; gap: 14px">
<a href="Main.dc.html" aria-label="Voltar para o início" style="width: 44px; height: 44px; border-radius: 999px; background: #ffffff; box-shadow: 0 0 0 1px #e3e7e5; display: flex; align-items: center; justify-content: center; color: #15201d"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></a>
<h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 600; letter-spacing: -0.01em">Ajustes</h1>
</header>

<section aria-labelledby="emp-t" style="display: flex; flex-direction: column; gap: 10px">
<h2 id="emp-t" style="margin: 0; font-size: 20px; line-height: 26px; font-weight: 600">Sua empresa</h2>
<label for="abertura" style="font-weight: 600">Mês de abertura do MEI</label>
<input id="abertura" type="month" value="{{abertura}}" style="min-height: 48px; box-sizing: border-box; padding: 0 12px; border: 1px solid #e3e7e5; border-radius: 12px; background: #ffffff; font: inherit; color: #15201d">
<p style="margin: 0; font-size: 14px; line-height: 21px; color: #5b6763">{{textoLimite}}</p>
</section>

<section aria-labelledby="seg-t" style="display: flex; flex-direction: column; gap: 10px">
<h2 id="seg-t" style="margin: 0; font-size: 20px; line-height: 26px; font-weight: 600">Segurança</h2>
<div style="display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-radius: 16px; background: #ffffff; box-shadow: 0 0 0 1px #e3e7e5">
<span aria-hidden="true" style="flex: none; width: 40px; height: 40px; border-radius: 999px; background: #e6f4f1; color: #0f766e; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>
<span style="font-size: 14px; line-height: 20px; color: #5b6763"><b style="display: block; color: #15201d; font-size: 15px">PIN e digital ligados</b>O app pede PIN ou digital ao abrir e depois de 1 minuto fora dele.</span>
</div>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<button type="button" style="min-height: 44px; padding: 0 16px; border: 1px solid #e3e7e5; border-radius: 12px; background: #ffffff; font: inherit; font-weight: 600; color: #15201d">Trocar PIN</button>
<button type="button" style="min-height: 44px; padding: 0 16px; border: 1px solid #e3e7e5; border-radius: 12px; background: #ffffff; font: inherit; font-weight: 600; color: #15201d">Desligar digital</button>
<button type="button" style="min-height: 44px; padding: 0 16px; border: 1px solid #e3e7e5; border-radius: 12px; background: #ffffff; font: inherit; font-weight: 600; color: #15201d">Desligar PIN</button>
</div>
</section>

<section aria-labelledby="bkp-t" style="display: flex; flex-direction: column; gap: 10px">
<h2 id="bkp-t" style="margin: 0; font-size: 20px; line-height: 26px; font-weight: 600">Backup</h2>
<ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px">
<li style="display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 20px; color: #5b6763"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#15803d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 1px"><path d="m5 12 5 5 9-10"/></svg>Os dados ficam só neste celular, e o navegador foi avisado para não apagá-los.</li>
<li style="display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 20px; color: #5b6763"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#15803d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 1px"><path d="m5 12 5 5 9-10"/></svg>Último backup em {{ultimoBackup}}.</li>
</ul>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<button type="button" style="min-height: 44px; padding: 0 16px; border: 0; border-radius: 12px; background: #0f766e; font: inherit; font-weight: 600; color: #ffffff">Fazer backup</button>
<button type="button" style="min-height: 44px; padding: 0 16px; border: 1px solid #e3e7e5; border-radius: 12px; background: #ffffff; font: inherit; font-weight: 600; color: #15201d">Restaurar backup</button>
</div>
</section>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":980}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      abertura: '2026-08',
      textoLimite: 'Aberto em agosto de 2026. Limite de 2026: R$ 33.750,00 (5 meses × R$ 6.750,00).',
      ultimoBackup: '21 out'
    };
  }
}
</script>
</body>
</html>
