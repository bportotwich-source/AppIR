<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var qr = [];
    function finder(x, y) {
      for (var cx = 0; cx < 3; cx++) for (var cy = 0; cy < 3; cy++) {
        var ox = cx === 0 ? 0 : 14, oy = cy === 0 ? 0 : 14;
        if ((cx === 0 || cy === 0) && !(cx === 2 && cy === 2) && cx !== 1 && cy !== 1) {
          var dx = x - ox, dy = y - oy;
          if (dx >= 0 && dx < 7 && dy >= 0 && dy < 7) {
            var r = Math.max(Math.abs(dx - 3), Math.abs(dy - 3));
            return r === 3 || r <= 1 ? 1 : 0;
          }
        }
      }
      return -1;
    }
    for (var y = 0; y < 21; y++) for (var x = 0; x < 21; x++) {
      var f = finder(x, y);
      var on = f >= 0 ? f === 1 : ((x * 7 + y * 13 + x * y) % 5) < 2;
      qr.push(on ? '#1a1a1a' : 'transparent');
    }
    return {
      qr: qr,
      linhasCupom: [
        { n: '001 ARROZ TIPO1 5KG', v: '27,90' }, { n: '002 FEIJAO CARIOCA 1KG', v: '8,49' },

      ]
    };
  }
}
